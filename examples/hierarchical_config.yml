# The yaml_runner section in a config is used to configure
# the yaml_runner engine, when using the cli.
yaml_runner:
  # Since hierarchical is set to true, every key with a command under it,
  # will be treated as a subcommand.
  hierarchical: true

# To run any of the commands under this the user will need to use run as
# the first argument.
run:
  description: "Run a command."
  # To use this the user would need to run `yaml_runner run hello_world`
  hello_world:
    command: echo "hello world"
    description: print hello world in stdout
  example:
    description: "Example of how nested commands work."
    # Since this is nested under multiple keys,
    # the user would need to give each key as an argument, in sequence.
    # e.g. yaml_runner run example nested
    nested:
      description: "Run the nested command."
      command: echo "This is the nested command"
    # Even when nested, command lists and params can be used
    list:
      description: "Run a list of commands"
      command:
        - echo "These"
        - echo "are"
        - echo "separate"
        - echo "echoes"
        - echo "$@"
      params:
        passthrough: true
      arguments:
        argument:
          description: Third word, only accepts a or b.
          choices:
            - a
            - b

# Since neither of the sections below contain a command key,
# they will both be ignored.
unrecognised:
  - This
  - Should
  - Always
  - Be
  - ignored
unrecognised_nested:
  nest:
    - example
