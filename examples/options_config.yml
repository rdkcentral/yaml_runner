# The yaml_runner section in a config is used to configure
# the yaml_runner engine, when using the cli.
yaml_runner:
  hierarchical: True

top_group:
  flag_command:
    command: "echo {{aflag}}"
    flags:
      aflag:
        short: "f" # This can be called with --aflag or -f
        value: "This will replace {{aflag}} if provided." # A value must be provided for a flag.
        description: "This will show in the help message for this command."
  option_command:
    command: "echo {{anoption}}"
    options:
      anoption:
        short: "o"
        description: "This will show in the help message for this command."
        required: True # Must be provided
  argument_command:
    command: "echo {{anargument}}"
    arguments:
      anargument:
        description: "This will show in the help message for this command."
        # Must provide a or b for this argument
        choices:
          - "a"
          - "b"

  # IMPORTANT NOTE: This is for hierarchical config mode. In the simple mode commands are
  # standalone and therefore no inheriting occurs.
  nested_example:
    # NOTE: Groups or commands with subcommands cannot provide arguments.
    description: "This group can provide options or flags that all children inherit."
    options:
      inherited-o:
        description: "This option is inherited by child commands."
    flags:
      inherited-f:
        value: "Flags must provide a value to replace a placeholder."
        description: "This flag is inherited by child commands."
    a_subcommand:
      command: "echo {{inherited-o}} {{inherited-f}} $@"
      description: "This subcommand inherits the options and flags from above."
      # All commands can still enable passthrough which will replace all `$@`s in the command.
      params:
        passthrough: True


