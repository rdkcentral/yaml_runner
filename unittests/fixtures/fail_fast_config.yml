# The yaml_runner section in a config is used to configure
# the yaml_runner engine, when using the cli.
yaml_runner:
  # By default if a command a command list returns a non-zero exit code,
  # the rest of the commands in the list will not be run.
  # If fail_fast is set to false, all commands will be run regardless.
  fail_fast: false

run:
  list:
    description: Run each command listed in the command.
    # All commands here should be run successfully.
    command:
      - echo "echo 1"
      - echo "echo 2"
      - echo "echo 3"
      - echo "echo 4"
  list_failure:
    description: Run each command listed, continuing after failing the second.
    command:
      - echo "echo 1"
      - this_isnt_a_real_command # This command should fail.
      - echo "echo 3"
      - echo "echo 4"
